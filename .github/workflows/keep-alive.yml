name: Keep Alive

on:
  schedule:
    - cron: "0 */11 * * *"  # Every 11 hours
  workflow_dispatch:        # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping BidWise
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://bidwise.streamlit.app)
          echo "HTTP status: $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "Site is alive."
          else
            echo "Unexpected status code: $STATUS" && exit 1
          fi
